name: Update README cards

# Generates the GitHub stats cards as SVG files committed into this repo,
# instead of hotlinking github-readme-stats.vercel.app at page-load time.
#
# Why: the public Vercel instance is rate-limited and regularly fails to
# render. The maintainers document this themselves and recommend exactly
# this approach. A committed SVG is served by GitHub and cannot rate-limit.
#
# FIRST RUN: go to the Actions tab -> "Update README cards" -> "Run workflow".
# Nothing appears in the README until this has run at least once.
#
# REQUIRED SETTING: Settings -> Actions -> General -> Workflow permissions
# -> "Read and write permissions". Without it the commit step fails with 403.

on:
  schedule:
    - cron: "0 3 * * *"   # daily, 03:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore: update README cards"
          git push

# PRIVATE REPO STATS (optional):
# GITHUB_TOKEN only sees public data. To include private contributions,
# create a classic PAT with `repo` and `read:user` scopes, add it under
# Settings -> Secrets and variables -> Actions as README_STATS_TOKEN, then
# replace both `token:` lines with:
#   token: ${{ secrets.README_STATS_TOKEN }}
# and add &count_private=true to the stats card options.
